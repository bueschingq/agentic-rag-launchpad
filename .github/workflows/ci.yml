name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # npm ci against the committed lockfile; a fresh install if a branch has none.
      - name: Install
        id: install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
            echo "lockfile=generated" >> "$GITHUB_OUTPUT"
          fi

      # Each check runs even when an earlier one fails, so a single run reports everything.
      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      # The lockfile and the first migrations have to come from somewhere with npm access.
      # Until both are committed, CI generates them and attaches them to the run for review.
      - name: Generate migrations
        id: migrations
        if: ${{ !cancelled() && steps.install.outcome == 'success' && hashFiles('packages/db/migrations/*.sql') == '' }}
        run: npm run db:generate
      - name: Upload generated files
        if: ${{ !cancelled() && (steps.install.outputs.lockfile == 'generated' || steps.migrations.outcome == 'success') }}
        uses: actions/upload-artifact@v7
        with:
          name: generated-files
          path: |
            package-lock.json
            packages/db/migrations/
          if-no-files-found: ignore

      # For contributors who can't run Biome locally: when lint fails, attach its safe fixes
      # (formatting, import order) as a patch to `git apply`, then list whatever is left.
      # This rewrites the checkout, so it stays last.
      - name: Prepare lint fixes
        id: lintfix
        if: ${{ !cancelled() && steps.lint.outcome == 'failure' }}
        run: |
          npx biome check --write . || true
          git diff > biome-fixes.patch
          echo "Patch touches $(git diff --name-only | wc -l) files. Still failing after it:"
          npx biome check --max-diagnostics=200 . || true
      - name: Upload lint fixes
        if: ${{ !cancelled() && steps.lintfix.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: biome-fixes
          path: biome-fixes.patch
